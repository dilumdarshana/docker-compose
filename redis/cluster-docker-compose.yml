# Redis Cluster for local development
# 6 nodes (3 masters + 3 replicas) on a dedicated bridge network.
#
# After `up -d`, create the cluster once:
#   docker exec -it redis-cluster-1 redis-cli --cluster create \
#     redis-cluster-1:6379 redis-cluster-2:6379 redis-cluster-3:6379 \
#     redis-cluster-4:6379 redis-cluster-5:6379 redis-cluster-6:6379 \
#     --cluster-replicas 1
#
# Connect with: redis-cli -c -p 7001
services:
  redis-cluster-1:
    image: redis:7-alpine
    container_name: redis-cluster-1
    hostname: redis-cluster-1
    ports:
      - "7001:6379"
    volumes:
      - ./data/cluster-1:/data
    command: >
      redis-server
      --appendonly yes
      --dir /data
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip redis-cluster-1
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    networks:
      redis-cluster-net:
        ipv4_address: 172.22.0.2

  redis-cluster-2:
