# Redis service for local development / caching
services:
  redis:
    image: redis:8-alpine
    container_name: my-redis
    ports:
      - "6379:6379" # host:container — change host port if 6379 is taken locally

    # Persistence + auth config passed as redis-server CLI args
    command: >
      redis-server
      --appendonly yes
      --appendfilename redis-data.aof
      --dir /data
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data # named volume so data survives container recreation

    restart: unless-stopped # auto-restart unless you manually stop it

    # Confirms Redis is actually accepting authenticated commands, not just that the process is alive
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--raw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data: # managed by Docker, lives under /var/lib/docker/volumes/